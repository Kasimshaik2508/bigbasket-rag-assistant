# Theme: deep "leaf" green on white; turmeric is used only for prices (set in app.py CSS).
# Changes here need an app restart.
[theme]
base = "light"
primaryColor = "#2F5D2A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF4E8"
textColor = "#1E2A1B"
font = "sans serif"

[client]
toolbarMode = "minimal"
