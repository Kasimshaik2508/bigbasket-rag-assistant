[project]
name = "bigbasket-rag-assistant"
version = "0.2.0"
description = "RAG chatbot for BigBasket product discovery with hybrid retrieval, re-ranking, and query decomposition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=3.3.0",
    "groq>=0.11.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.40",
    "torch>=2.15.0",
]
